<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World War</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ====================== الأساسيات ====================== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow-x: hidden; }
body { background:#05060f; color:#e6ecff; position:relative; display: flex; flex-direction: column; }

/* ====================== تأثيرات الخلفية ====================== */
.bg-blobs { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.bg-blobs span { position:absolute; border-radius:50%; filter: blur(50px); animation: float 15s infinite ease-in-out alternate; }
.bg-blobs span:nth-child(1){ width:40vw; height:40vw; top:-10%; left:-10%; background: radial-gradient(circle, rgba(0,212,255,.25), transparent 70%); }
.bg-blobs span:nth-child(2){ width:50vw; height:50vw; bottom:-10%; right:-10%; background: radial-gradient(circle, rgba(168,85,247,.25), transparent 70%); animation-delay:-5s; }
.bg-blobs span:nth-child(3){ width:30vw; height:30vw; top:40%; left:40%; background: radial-gradient(circle, rgba(255,0,110,.15), transparent 70%); animation-delay:-10s; }
@keyframes float{ 0%{ transform:translate(0,0) scale(1);} 100%{ transform:translate(50px,50px) scale(1.1);} }

.grid-overlay { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 30px 30px; mask-image: radial-gradient(circle at center, black, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%); }

/* ====================== شاشة الدخول ====================== */
.auth-screen { position:relative; z-index:10; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.auth-card { width:100%; max-width:440px; padding:40px 30px; background: rgba(15,18,35,.7); backdrop-filter: blur(25px); border-radius:24px; border:1px solid rgba(0,212,255,.2); box-shadow: 0 25px 60px rgba(0,0,0,.8); animation: cardEntry .8s cubic-bezier(.2,.9,.3,1.2); }
@keyframes cardEntry{ from{opacity:0; transform:translateY(40px) scale(.95);} to{opacity:1; transform:none;} }

.logo h1 { font-size:28px; font-weight:900; text-align:center; margin-bottom:30px; background: linear-gradient(90deg,#00d4ff,#a855f7,#00d4ff); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation: shine 3s linear infinite; filter: drop-shadow(0 0 8px rgba(0,212,255,.5)); }
@keyframes shine{ to{ background-position:200% center; } }

.tabs { position:relative; display:flex; padding:6px; margin-bottom:24px; background: rgba(255,255,255,.03); border-radius:16px; border: 1px solid rgba(255,255,255,.05); }
.tab { flex:1; padding:14px; background:transparent; border:none; color:#8892b0; font-weight:700; font-size:14px; cursor:pointer; z-index:2; transition:color .3s; }
.tab.active{ color:#fff; }
.tab-slider { position:absolute; top:6px; bottom:6px; width:calc(50% - 6px); background: linear-gradient(135deg,#00d4ff,#a855f7); border-radius:12px; box-shadow:0 0 20px rgba(0,212,255,.6); transition: transform .4s cubic-bezier(.68,-.55,.27,1.55); }
.tabs[data-active="register"] .tab-slider{ transform:translateX(-100%); }

.auth-form { display:none; flex-direction:column; gap:20px; }
.auth-form.active { display:flex; animation: fadeIn .4s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateX(15px);} to{opacity:1; transform:none;} }

.input-group { position:relative; }
.input-group input { width:100%; padding:18px 16px 8px; background: rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.1); border-radius:12px; color:#fff; font-size:15px; outline:none; transition: all .3s; }
.input-group label { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:#6c7794; font-size:14px; pointer-events:none; transition: all .3s; }
.input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { top:10px; transform:none; font-size:11px; color:#00d4ff; }
.input-group input:focus { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,.3); background: rgba(0,212,255,.05); }

.btn-primary { padding:16px; border:none; border-radius:12px; background: linear-gradient(135deg,#00d4ff,#a855f7); color:#fff; font-weight:900; font-size:16px; cursor:pointer; transition: all .3s; box-shadow:0 10px 20px rgba(0,212,255,.3); }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 15px 30px rgba(168,85,247,.6); }
.switch-text { text-align:center; color:#6c7794; font-size:13px; margin-top: 5px; }
.switch-text a { color:#00d4ff; text-decoration:none; font-weight:700; cursor:pointer; }

/* ====================== لوحة التحكم ====================== */
.dashboard { display:none; flex: 1; flex-direction: column; position:relative; z-index:10; width: 100%; }
.dashboard.active { display:flex; animation: fadeIn .4s ease; }

/* الشريط العلوي */
.topbar { min-height:60px; display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background: rgba(10,14,30,.85); backdrop-filter: blur(20px); border-bottom:1px solid rgba(0,212,255,.2); position:sticky; top:0; z-index:100; flex-wrap: wrap; gap: 10px; box-shadow: 0 5px 20px rgba(0,0,0,.5); }

.brand { 
  display:flex; align-items:center; gap:10px; font-weight:900; font-size:18px; 
  background: linear-gradient(90deg, #00d4ff, #fff, #a855f7, #00d4ff); 
  background-size: 300% auto; 
  -webkit-background-clip: text; 
  -webkit-text-fill-color: transparent; 
  animation: brandShine 3s linear infinite; 
  filter: drop-shadow(0 0 5px rgba(0,212,255,.6)); 
}
@keyframes brandShine { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }

.user-area { display:flex; align-items:center; gap:8px; flex-wrap: wrap; justify-content: flex-end; }
.user-chip { display:flex; align-items:center; gap:8px; padding:4px 12px 4px 4px; background: rgba(255,255,255,.05); border-radius:999px; border: 1px solid rgba(255,255,255,.1); }
.avatar { width:30px; height:30px; border-radius:50%; background: linear-gradient(135deg,#00d4ff,#a855f7); display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:13px; box-shadow: 0 0 10px rgba(0,212,255,.5); }
.logout-btn { background: rgba(255,80,80,.1); border:1px solid rgba(255,80,80,.3); color:#ff6b6b; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px; transition: .3s; }
.logout-btn:hover { background: rgba(255,80,80,.2); box-shadow: 0 0 15px rgba(255,80,80,.4); }

/* شريط الرصيد */
.balance-bar { display:flex; align-items:center; justify-content:space-between; padding:6px 20px; background: rgba(10,14,30,.85); backdrop-filter: blur(20px); border-bottom:1px solid rgba(168,85,247,.2); position:sticky; top:60px; z-index:99; box-shadow: 0 5px 20px rgba(0,0,0,.5); }
.balance-label { color:#8892b0; font-size:11px; font-weight:600; }
.balance-value { font-size:20px; font-weight:900; background: linear-gradient(90deg,#00d4ff,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter: drop-shadow(0 0 10px rgba(0,212,255,.5)); }

/* ====================== منطقة الأزرار ====================== */
.actions-zone { flex: 1; padding: 25px 15px; display: flex; align-items: flex-start; justify-content: center; }
.actions-rect { width: 100%; max-width: 800px; display: grid; grid-template-columns: 1fr; gap: 15px; }

.action-box { background: rgba(15,18,35,.6); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:20px 15px; display:flex; flex-direction:column; gap:15px; transition: all .4s; box-shadow: inset 0 0 20px rgba(255,255,255,.02), 0 10px 20px rgba(0,0,0,.3); }
.action-box:hover { border-color: rgba(0,212,255,.3); transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,.5), 0 0 20px rgba(0,212,255,.1); }

.action-box .btns { display:flex; flex-direction:column; gap:12px; flex: 1; }

.action-btn { width: 100%; border:none; border-radius:12px; padding:15px 10px; font-weight:700; font-size:14px; cursor:pointer; transition: all .3s; display:flex; align-items:center; justify-content:center; gap:8px; position: relative; overflow: hidden; }
.action-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent); transition: all .4s; }
.action-btn:hover::before { left: 100%; }

.action-btn.deposit { background: rgba(0,212,255,.08); border:1px solid rgba(0,212,255,.4); color:#00d4ff; }
.action-btn.deposit:hover { background: #00d4ff; color:#000; box-shadow: 0 0 20px rgba(0,212,255,.8); transform: scale(1.02); }
.action-btn.withdraw { background: rgba(255,80,80,.08); border:1px solid rgba(255,80,80,.4); color:#ff6b6b; }
.action-btn.withdraw:hover { background: #ff6b6b; color:#000; box-shadow: 0 0 20px rgba(255,80,80,.8); transform: scale(1.02); }

@media (max-width: 350px) {
  .action-btn { padding: 12px 5px; font-size: 12px; }
}

/* ====================== نظام الإشعارات (Toast) ====================== */
.toast-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  width: calc(100% - 40px);
  max-width: 420px;
}

.toast {
  padding: 14px 20px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px rgba(0,0,0,.6);
  animation: toastIn .4s cubic-bezier(.2,.9,.3,1.2) forwards;
  pointer-events: auto;
  text-align: center;
  border: 1px solid transparent;
  word-wrap: break-word;
}

.toast.success {
  background: rgba(34, 197, 94, .15);
  border-color: rgba(34, 197, 94, .5);
  color: #4ade80;
  box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 20px rgba(34, 197, 94, .3);
}

.toast.error {
  background: rgba(255, 80, 80, .15);
  border-color: rgba(255, 80, 80, .5);
  color: #ff6b6b;
  box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 20px rgba(255, 80, 80, .3);
}

.toast.hide {
  animation: toastOut .4s ease forwards;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(-20px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to   { opacity: 0; transform: translateY(-20px) scale(.95); }
}
</style>
</head>
<body>

<div class="bg-blobs"><span></span><span></span><span></span></div>
<div class="grid-overlay"></div>

<div class="toast-container" id="toastContainer"></div>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="logo"><h1>World War</h1></div>
    <div class="tabs" data-active="login">
      <button class="tab active" data-tab="login">تسجيل الدخول</button>
      <button class="tab" data-tab="register">إنشاء حساب</button>
      <div class="tab-slider"></div>
    </div>
    <form id="loginForm" class="auth-form active">
      <div class="input-group"><input type="text" id="loginName" placeholder=" " required><label>الاسم الأول والثاني</label></div>
      <div class="input-group"><input type="password" id="loginPassword" placeholder=" " required><label>كلمة المرور</label></div>
      <button type="submit" class="btn-primary">دخول</button>
      <p class="switch-text">ليس لديك حساب؟ <a data-tab="register">أنشئ حساباً</a></p>
    </form>
    <form id="registerForm" class="auth-form">
      <div class="input-group"><input type="text" id="regName" placeholder=" " required><label>الاسم الأول والثاني</label></div>
      <div class="input-group"><input type="password" id="regPassword" placeholder=" " required minlength="6"><label>كلمة المرور</label></div>
      <button type="submit" class="btn-primary">إنشاء الحساب</button>
      <p class="switch-text">لديك حساب؟ <a data-tab="login">سجل الدخول</a></p>
    </form>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="brand">World War</div>
    <div class="user-area">
      <div class="user-chip">
        <div class="avatar" id="avatar">U</div>
      </div>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </div>

  <div class="balance-bar">
    <div>
      <div class="balance-label">رصيدك الحالي</div>
      <div class="balance-value">$<span id="balance">0.00</span></div>
    </div>
  </div>

  <div class="actions-zone">
    <div class="actions-rect">
      <div class="action-box">
        <div class="btns">
          <button class="action-btn deposit" onclick="doAction('deposit')"><span>إيداع</span></button>
          <button class="action-btn withdraw" onclick="doAction('withdraw')"><span>سحب</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let currentUser = null;

/* ====================== نظام الإشعارات ====================== */
function showToast(message, type = 'success', duration = 3000) {
  const container = $('#toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('hide');
    toast.addEventListener('animationend', () => toast.remove(), { once: true });
  }, duration);
}

/* ====================== API Helper ====================== */
async function api(url, options={}) {
  const res = await fetch(url, { headers: {'Content-Type':'application/json'}, credentials:'include', ...options });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'حدث خطأ');
  return data;
}

/* ====================== التبويبات ====================== */
document.querySelectorAll('.tab, [data-tab]').forEach(el => {
  if (el.classList.contains('tab') || el.tagName === 'A'){
    el.addEventListener('click', e => {
      const target = el.dataset.tab; if (!target) return; e.preventDefault();
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === target));
      $('#loginForm').classList.toggle('active', target === 'login');
      $('#registerForm').classList.toggle('active', target === 'register');
      $('.tabs').dataset.active = target;
    });
  }
});

/* ====================== تسجيل الدخول ====================== */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#loginName').value.trim();
  const password = $('#loginPassword').value;

  if (!name || !password) {
    showToast('يرجى إدخال جميع البيانات', 'error');
    return;
  }

  try {
    await api('/api/login', { method:'POST', body: JSON.stringify({ name, password }) });
    showToast('تم تسجيل الدخول بنجاح', 'success');
    setTimeout(() => enterDashboard(), 600);
  } catch(err){
    showToast(err.message || 'البيانات خاطئة', 'error');
  }
});

/* ====================== إنشاء حساب ====================== */
$('#registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#regName').value.trim();
  const password = $('#regPassword').value;

  if (!name || !password) {
    showToast('يرجى إدخال جميع البيانات', 'error');
    return;
  }
  if (password.length < 6) {
    showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
    return;
  }

  try {
    await api('/api/register', { method:'POST', body: JSON.stringify({ name, password }) });
    await api('/api/login', { method:'POST', body: JSON.stringify({ name, password }) });
    showToast('تم إنشاء الحساب وتسجيل الدخول بنجاح', 'success');
    setTimeout(() => enterDashboard(), 600);
  } catch(err){
    showToast(err.message || 'فشل إنشاء الحساب', 'error');
  }
});

/* ====================== خروج ====================== */
$('#logoutBtn').addEventListener('click', async () => {
  try {
    await api('/api/logout', {method:'POST'});
    showToast('تم تسجيل الخروج بنجاح', 'success');
    setTimeout(() => location.reload(), 800);
  } catch(err) {
    showToast('حدث خطأ أثناء تسجيل الخروج', 'error');
  }
});

/* ====================== لوحة التحكم ====================== */
async function enterDashboard() {
  try {
    const { user } = await api('/api/me');
    currentUser = user;
    $('#avatar').textContent = currentUser.name.charAt(0).toUpperCase();
    $('#balance').textContent = Number(currentUser.balance).toFixed(2);

    $('#authScreen').style.display = 'none';
    $('#dashboard').classList.add('active');
  } catch(err) {
    /* إذا لم يكن مسجلاً، ابقَ في شاشة الدخول */
  }
}

/* ====================== أزرار الإيداع والسحب ====================== */
function doAction(type) {
  if (type === 'deposit') {
    showToast('ميزة الإيداع قيد التطوير', 'error');
  } else if (type === 'withdraw') {
    showToast('ميزة السحب قيد التطوير', 'error');
  }
}

/* ====================== التهيئة ====================== */
(async () => { try { await enterDashboard(); } catch(e) {} })();
</script>
</body>
</html>
