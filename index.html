<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICHANCY WEBSITE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ====================== الأساسيات ====================== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
html, body { height:100%; }
body {
  background:#05060f;
  color:#e6ecff;
  overflow-x:hidden;
  position:relative;
}

/* خلفية متحركة */
.bg-blobs {
  position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;
}
.bg-blobs span {
  position:absolute; border-radius:50%;
  background: radial-gradient(circle, rgba(0,212,255,.18), transparent 70%);
  filter: blur(30px);
  animation: float 18s infinite ease-in-out;
}
.bg-blobs span:nth-child(1){ width:300px;height:300px; top:-5%; left:-5%; animation-delay:0s;}
.bg-blobs span:nth-child(2){ width:400px;height:400px; top:40%; left:70%; animation-delay:3s;
  background: radial-gradient(circle, rgba(168,85,247,.18), transparent 70%);}
.bg-blobs span:nth-child(3){ width:250px;height:250px; top:70%; left:20%; animation-delay:6s;}
.bg-blobs span:nth-child(4){ width:350px;height:350px; top:10%; left:60%; animation-delay:9s;
  background: radial-gradient(circle, rgba(255,0,180,.14), transparent 70%);}
@keyframes float{
  0%,100%{ transform:translate(0,0) scale(1);}
  50%{ transform:translate(80px,-100px) scale(1.3);}
}

/* ====================== شاشة الدخول ====================== */
.auth-screen {
  position:relative; z-index:10;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.auth-card {
  width:100%; max-width:440px;
  padding:45px 40px;
  background: rgba(15,18,35,.7);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-radius:24px;
  border:1px solid rgba(0,212,255,.2);
  box-shadow:
    0 25px 60px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.05),
    0 0 80px rgba(0,212,255,.08);
  animation: cardEntry .7s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes cardEntry{ from{opacity:0; transform:translateY(40px) scale(.95);} to{opacity:1; transform:none;} }

.logo {
  text-align:center; margin-bottom:28px;
}
.logo h1{
  font-size:26px; font-weight:900; letter-spacing:2px;
  background: linear-gradient(90deg,#00d4ff,#a855f7,#00d4ff);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: shine 3s linear infinite;
}
.logo h1 span{
  -webkit-text-fill-color:#fff; color:#fff;
  font-size:18px; opacity:.7; margin-right:6px;
}
@keyframes shine{ to{ background-position:200% center; } }
.logo .line{
  height:2px; width:60px; margin:12px auto 0;
  background: linear-gradient(90deg,transparent,#00d4ff,transparent);
  animation: linePulse 2s infinite alternate;
}
@keyframes linePulse{ from{opacity:.3;width:40px;} to{opacity:1;width:120px;} }

.tabs{
  position:relative; display:flex; padding:5px; margin-bottom:28px;
  background: rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
}
.tab{
  flex:1; padding:12px; background:transparent; border:none;
  color:#8892b0; font-weight:700; font-size:14px; cursor:pointer;
  position:relative; z-index:2; transition:color .3s; font-family:'Cairo',sans-serif;
}
.tab.active{ color:#fff; }
.tab-slider{
  position:absolute; top:5px; bottom:5px; width:calc(50% - 5px);
  background: linear-gradient(135deg,#00d4ff,#a855f7);
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,212,255,.4);
  transition: transform .4s cubic-bezier(.68,-.55,.27,1.55);
}
.tabs[data-active="register"] .tab-slider{ transform:translateX(-100%); }

.auth-form{ display:none; flex-direction:column; gap:18px; }
.auth-form.active{ display:flex; animation: fadeIn .4s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateX(15px);} to{opacity:1; transform:none;} }

.input-group{ position:relative; }
.input-group input{
  width:100%; padding:18px 16px 8px;
  background: rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px; color:#fff; font-size:15px;
  font-family:'Cairo',sans-serif; outline:none;
  transition: all .3s;
}
.input-group label{
  position:absolute; right:16px; top:50%; transform:translateY(-50%);
  color:#6c7794; font-size:14px; pointer-events:none; transition: all .3s;
}
.input-group input:focus ~ label,
.input-group input:not(:placeholder-shown) ~ label{
  top:10px; transform:none; font-size:11px; color:#00d4ff;
}
.input-group input:focus{
  border-color: rgba(0,212,255,.5);
  background: rgba(0,212,255,.05);
  box-shadow: 0 0 0 4px rgba(0,212,255,.1);
}

.btn-primary{
  position:relative; padding:16px; border:none; border-radius:12px;
  background: linear-gradient(135deg,#00d4ff,#a855f7);
  color:#fff; font-weight:700; font-size:16px; cursor:pointer;
  overflow:hidden; transition: transform .3s, box-shadow .3s;
  box-shadow:0 10px 30px rgba(0,212,255,.3);
  font-family:'Cairo',sans-serif;
}
.btn-primary:hover{ transform:translateY(-3px); box-shadow:0 15px 40px rgba(168,85,247,.5);}
.btn-primary::after{
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transition: left .6s;
}
.btn-primary:hover::after{ left:100%; }

.switch-text{ text-align:center; color:#6c7794; font-size:13px; }
.switch-text a{ color:#00d4ff; text-decoration:none; font-weight:700; cursor:pointer;}
.switch-text a:hover{ text-decoration:underline; }

/* ====================== لوحة التحكم ====================== */
.dashboard{ display:none; min-height:100vh; position:relative; z-index:10; flex-direction:column;}
.dashboard.active{ display:flex; }

/* الشريط العلوي */
.topbar{
  height:64px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px;
  background: linear-gradient(90deg, rgba(15,18,35,.85), rgba(25,20,60,.85));
  backdrop-filter: blur(20px);
  border-bottom:1px solid rgba(0,212,255,.15);
  position:sticky; top:0; z-index:100;
}
.brand{
  display:flex; align-items:center; gap:8px;
  font-weight:900; font-size:18px; letter-spacing:1.5px;
  background: linear-gradient(90deg,#00d4ff,#a855f7);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.brand-icon{
  width:32px; height:32px; border-radius:10px;
  background: linear-gradient(135deg,#00d4ff,#a855f7);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; color:#fff; -webkit-text-fill-color:#fff;
  box-shadow: 0 5px 20px rgba(0,212,255,.4);
  animation: rotate 6s linear infinite;
}
@keyframes rotate{ to{ transform:rotate(360deg); } }

.user-chip{
  display:flex; align-items:center; gap:10px;
  padding:6px 14px 6px 6px;
  background: rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
}
.avatar{
  width:32px; height:32px; border-radius:50%;
  background: linear-gradient(135deg,#00d4ff,#a855f7);
  display:flex; align-items:center; justify-content:center;
  font-weight:900; color:#fff; font-size:14px;
}
.user-chip .name{ font-weight:700; font-size:13px; }
.logout-btn{
  background: transparent; border:1px solid rgba(255,80,80,.4);
  color:#ff6b6b; padding:6px 12px; border-radius:8px; cursor:pointer;
  font-family:'Cairo',sans-serif; font-weight:700; font-size:12px;
  transition: all .3s;
}
.logout-btn:hover{ background: rgba(255,80,80,.15); }

/* شريط الرصيد والإشعارات */
.balance-bar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px;
  background: rgba(10,14,30,.6);
  backdrop-filter: blur(15px);
  border-bottom:1px solid rgba(168,85,247,.15);
}
.balance-info{ display:flex; align-items:center; gap:14px; }
.balance-label{ color:#8892b0; font-size:13px; font-weight:600;}
.balance-value{
  font-size:26px; font-weight:900;
  background: linear-gradient(90deg,#00d4ff,#a855f7);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow: 0 0 30px rgba(0,212,255,.4);
  animation: pulseGlow 2s infinite alternate;
}
@keyframes pulseGlow{
  from{ filter: drop-shadow(0 0 6px rgba(0,212,255,.3)); }
  to{ filter: drop-shadow(0 0 16px rgba(168,85,247,.6)); }
}

.notif-wrap{ position:relative; }
.notif-btn{
  position:relative;
  width:44px; height:44px; border-radius:12px;
  background: rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  color:#e6ecff; cursor:pointer; font-size:20px;
  transition: all .3s;
  display:flex; align-items:center; justify-content:center;
}
.notif-btn:hover{ background: rgba(0,212,255,.15); border-color: rgba(0,212,255,.4); }
.notif-badge{
  position:absolute; top:-4px; right:-4px;
  min-width:20px; height:20px; padding:0 5px;
  background: linear-gradient(135deg,#ff006e,#ff4d4d);
  border-radius:999px; font-size:11px; font-weight:900;
  display:flex; align-items:center; justify-content:center; color:#fff;
  box-shadow: 0 4px 12px rgba(255,0,110,.6);
  animation: badgePulse 1.6s infinite;
}
.notif-badge.hidden{ display:none; }
@keyframes badgePulse{
  0%,100%{ transform:scale(1);}
  50%{ transform:scale(1.15);}
}

.notif-panel{
  position:absolute; top:56px; left:0;
  width:340px; max-height:420px; overflow-y:auto;
  background: rgba(15,18,35,.95);
  backdrop-filter: blur(25px);
  border:1px solid rgba(0,212,255,.2);
  border-radius:16px;
  box-shadow: 0 25px 60px rgba(0,0,0,.7);
  padding:12px;
  display:none;
  z-index:200;
  animation: fadeIn .3s ease;
}
.notif-panel.open{ display:block; }
.notif-panel h4{ font-size:14px; padding:8px; color:#00d4ff; border-bottom:1px solid rgba(0,212,255,.2); margin-bottom:8px;}
.notif-item{
  padding:10px 12px; margin-bottom:6px; border-radius:10px;
  background: rgba(255,255,255,.03);
  border-right:3px solid transparent;
  transition: all .2s;
}
.notif-item.unread{
  background: rgba(0,212,255,.06);
  border-right-color: #00d4ff;
}
.notif-item .t{ font-weight:700; font-size:13px; margin-bottom:3px;}
.notif-item .b{ font-size:12px; color:#8892b0; line-height:1.5;}
.notif-item .d{ font-size:10px; color:#5a6480; margin-top:5px;}
.notif-empty{ text-align:center; padding:30px; color:#5a6480; font-size:13px;}

/* منطقة الأزرار (المستطيل المقسوم) */
.actions-zone{
  flex:1;
  padding:30px 24px;
  display:flex; flex-direction:column; gap:16px;
}
.actions-rect{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  min-height:160px; /* ارتفاع ضعف الشريط تقريباً */
}
.action-box{
  background: rgba(15,18,35,.7);
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:20px;
  display:flex; flex-direction:column; gap:12px;
  position:relative; overflow:hidden;
  transition: all .4s;
}
.action-box::before{
  content:''; position:absolute; inset:0;
  background: radial-gradient(circle at top right, rgba(0,212,255,.1), transparent 70%);
  opacity:0; transition:opacity .4s; pointer-events:none;
}
.action-box:hover::before{ opacity:1; }
.action-box:hover{ border-color: rgba(0,212,255,.4); transform:translateY(-2px);}
.action-box.box-2::before{
  background: radial-gradient(circle at top right, rgba(168,85,247,.12), transparent 70%);
}
.action-box.box-2:hover{ border-color: rgba(168,85,247,.4); }

.action-title{
  font-size:12px; font-weight:700; color:#8892b0;
  letter-spacing:1px; text-transform:uppercase;
}
.action-box .btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:1; }

.action-btn{
  border:none; border-radius:12px;
  padding:14px;
  font-family:'Cairo',sans-serif;
  font-weight:700; font-size:14px; cursor:pointer;
  transition: all .3s;
  position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.action-btn.deposit{
  background: linear-gradient(135deg, rgba(0,212,255,.2), rgba(0,212,255,.05));
  border:1px solid rgba(0,212,255,.4); color:#00d4ff;
}
.action-btn.deposit:hover{
  background: linear-gradient(135deg,#00d4ff,#0095c9);
  color:#fff; box-shadow:0 10px 30px rgba(0,212,255,.5);
  transform:translateY(-2px);
}
.action-btn.withdraw{
  background: linear-gradient(135deg, rgba(255,80,80,.2), rgba(255,80,80,.05));
  border:1px solid rgba(255,80,80,.4); color:#ff6b6b;
}
.action-btn.withdraw:hover{
  background: linear-gradient(135deg,#ff4d4d,#c43030);
  color:#fff; box-shadow:0 10px 30px rgba(255,80,80,.5);
  transform:translateY(-2px);
}
.action-btn.fill{
  background: linear-gradient(135deg, rgba(168,85,247,.2), rgba(168,85,247,.05));
  border:1px solid rgba(168,85,247,.4); color:#c084fc;
}
.action-btn.fill:hover{
  background: linear-gradient(135deg,#a855f7,#7e22ce);
  color:#fff; box-shadow:0 10px 30px rgba(168,85,247,.5);
  transform:translateY(-2px);
}
.action-btn.take{
  background: linear-gradient(135deg, rgba(34,197,94,.2), rgba(34,197,94,.05));
  border:1px solid rgba(34,197,94,.4); color:#4ade80;
}
.action-btn.take:hover{
  background: linear-gradient(135deg,#22c55e,#15803d);
  color:#fff; box-shadow:0 10px 30px rgba(34,197,94,.5);
  transform:translateY(-2px);
}

/* Toast */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translate(-50%,120%);
  padding:14px 24px; border-radius:12px;
  background: rgba(15,18,35,.95);
  backdrop-filter: blur(20px);
  border:1px solid rgba(0,212,255,.3);
  color:#fff; font-weight:700; font-size:14px;
  box-shadow: 0 20px 50px rgba(0,0,0,.7);
  transition: transform .4s cubic-bezier(.2,.9,.3,1.2);
  z-index:9999;
}
.toast.show{ transform:translate(-50%,0); }
.toast.error{ border-color: rgba(255,80,80,.5);}
.toast.success{ border-color: rgba(34,197,94,.5);}

/* Responsive */
@media (max-width:640px){
  .auth-card{ padding:35px 24px;}
  .logo h1{ font-size:22px;}
  .logo h1 span{ font-size:15px;}
  .topbar{ padding:0 14px;}
  .brand{ font-size:14px;}
  .brand-icon{ width:26px; height:26px; font-size:14px;}
  .balance-bar{ padding:12px 14px;}
  .balance-value{ font-size:20px;}
  .actions-zone{ padding:20px 14px;}
  .actions-rect{ grid-template-columns:1fr; }
  .notif-panel{ width:calc(100vw - 28px); left:-14px;}
  .user-chip .name{ display:none;}
}
</style>
</head>
<body>

<!-- خلفية -->
<div class="bg-blobs"><span></span><span></span><span></span><span></span></div>

<!-- ==================== شاشة الدخول ==================== -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="logo">
      <h1><span>ICHANCY</span> WEBSITE</h1>
      <div class="line"></div>
    </div>

    <div class="tabs" data-active="login">
      <button class="tab active" data-tab="login">تسجيل الدخول</button>
      <button class="tab" data-tab="register">إنشاء حساب</button>
      <div class="tab-slider"></div>
    </div>

    <form id="loginForm" class="auth-form active">
      <div class="input-group">
        <input type="email" id="loginEmail" placeholder=" " required>
        <label>البريد الإلكتروني</label>
      </div>
      <div class="input-group">
        <input type="password" id="loginPassword" placeholder=" " required>
        <label>كلمة المرور</label>
      </div>
      <button type="submit" class="btn-primary">دخول</button>
      <p class="switch-text">ليس لديك حساب؟ <a data-tab="register">أنشئ حساباً</a></p>
    </form>

    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <input type="text" id="regName" placeholder=" " required>
        <label>الاسم الكامل</label>
      </div>
      <div class="input-group">
        <input type="email" id="regEmail" placeholder=" " required>
        <label>البريد الإلكتروني</label>
      </div>
      <div class="input-group">
        <input type="password" id="regPassword" placeholder=" " required minlength="6">
        <label>كلمة المرور</label>
      </div>
      <button type="submit" class="btn-primary">إنشاء الحساب</button>
      <p class="switch-text">لديك حساب؟ <a data-tab="login">سجل الدخول</a></p>
    </form>
  </div>
</div>

<!-- ==================== لوحة التحكم ==================== -->
<div class="dashboard" id="dashboard">

  <!-- الشريط العلوي -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      ICHANCY WEBSITE
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="user-chip">
        <div class="avatar" id="avatar">U</div>
        <div class="name" id="userName">User</div>
      </div>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </div>

  <!-- شريط الرصيد والإشعارات -->
  <div class="balance-bar">
    <div class="balance-info">
      <div>
        <div class="balance-label">رصيدك الحالي</div>
        <div class="balance-value">$<span id="balance">0.00</span></div>
      </div>
    </div>
    <div class="notif-wrap">
      <button class="notif-btn" id="notifBtn">
        🔔
        <span class="notif-badge hidden" id="notifBadge">0</span>
      </button>
      <div class="notif-panel" id="notifPanel">
        <h4>📬 الإشعارات والبريد الجماعي</h4>
        <div id="notifList"></div>
      </div>
    </div>
  </div>

  <!-- منطقة الأزرار (مستطيل مقسوم) -->
  <div class="actions-zone">
    <div class="actions-rect">

      <div class="action-box box-1">
        <div class="action-title">💰 محفظتي</div>
        <div class="btns">
          <button class="action-btn deposit" onclick="doAction('deposit')">⬇ إيداع</button>
          <button class="action-btn withdraw" onclick="doAction('withdraw')">⬆ سحب</button>
        </div>
      </div>

      <div class="action-box box-2">
        <div class="action-title">🔄 التحويلات</div>
        <div class="btns">
          <button class="action-btn fill" onclick="doAction('fill')">➕ تعبئة حسابي</button>
          <button class="action-btn take" onclick="doAction('take')">➖ سحب من حسابي</button>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* =======================================================
   Utilities
   ======================================================= */
const $ = (s) => document.querySelector(s);
const toastEl = $('#toast');
function showToast(msg, type='success'){
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + type;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

async function api(url, options={}){
  const res = await fetch(url, {
    headers: {'Content-Type':'application/json'},
    credentials:'include',
    ...options
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'حدث خطأ');
  return data;
}

/* =======================================================
   Tabs
   ======================================================= */
const tabsContainer = $('.tabs');
document.querySelectorAll('.tab, [data-tab]').forEach(el => {
  if (el.classList.contains('tab') || el.tagName === 'A'){
    el.addEventListener('click', e => {
      if (el.classList.contains('tab') && el.dataset.tab === tabsContainer.dataset.active) return;
      const target = el.dataset.tab;
      if (!target) return;
      e.preventDefault();
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('active', t.dataset.tab === target));
      $('#loginForm').classList.toggle('active', target === 'login');
      $('#registerForm').classList.toggle('active', target === 'register');
      tabsContainer.dataset.active = target;
    });
  }
});

/* =======================================================
   Auth
   ======================================================= */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  try{
    await api('/api/login', {
      method:'POST',
      body: JSON.stringify({
        email: $('#loginEmail').value.trim(),
        password: $('#loginPassword').value
      })
    });
    showToast('تم الدخول بنجاح ✓');
    await enterDashboard();
  } catch(err){ showToast(err.message, 'error'); }
});

$('#registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  try{
    await api('/api/register', {
      method:'POST',
      body: JSON.stringify({
        name: $('#regName').value.trim(),
        email: $('#regEmail').value.trim(),
        password: $('#regPassword').value
      })
    });
    // تسجيل دخول تلقائي بعد التسجيل
    await api('/api/login', {
      method:'POST',
      body: JSON.stringify({
        email: $('#regEmail').value.trim(),
        password: $('#regPassword').value
      })
    });
    showToast('تم إنشاء الحساب ✓');
    await enterDashboard();
  } catch(err){ showToast(err.message, 'error'); }
});

$('#logoutBtn').addEventListener('click', async () => {
  await api('/api/logout', {method:'POST'});
  location.reload();
});

/* =======================================================
   Dashboard
   ======================================================= */
let currentUser = null;
let currentNotifs = [];

async function enterDashboard(){
  const { user } = await api('/api/me');
  currentUser = user;
  renderUser();
  $('#authScreen').style.display = 'none';
  $('#dashboard').classList.add('active');
  await loadNotifications();
}

function renderUser(){
  $('#userName').textContent = currentUser.name;
  $('#avatar').textContent = currentUser.name.charAt(0).toUpperCase();
  $('#balance').textContent = Number(currentUser.balance).toFixed(2);
}

async function loadNotifications(){
  try{
    const data = await api('/api/notifications');
    currentNotifs = data.notifications;
    renderNotifs(data.unread);
  } catch(e){ /* ignore */ }
}

function renderNotifs(unread){
  const badge = $('#notifBadge');
  if (unread > 0){ badge.textContent = unread; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');

  const list = $('#notifList');
  if (!currentNotifs.length){
    list.innerHTML = '<div class="notif-empty">لا توجد إشعارات حالياً</div>';
    return;
  }
  list.innerHTML = currentNotifs.map(n => `
    <div class="notif-item ${n.is_read ? '' : 'unread'}">
      <div class="t">${escapeHtml(n.title)}</div>
      <div class="b">${escapeHtml(n.body)}</div>
      <div class="d">${new Date(n.created_at).toLocaleString('ar')}</div>
    </div>
  `).join('');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// فتح/إغلاق الإشعارات
$('#notifBtn').addEventListener('click', async e => {
  e.stopPropagation();
  const p = $('#notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')){
    await api('/api/notifications/read', {method:'POST'}).catch(()=>{});
    currentNotifs.forEach(n => n.is_read = 1);
    renderNotifs(0);
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.notif-wrap')) $('#notifPanel').classList.remove('open');
});

/* =======================================================
   Actions (هيكل أساسي - سيتم توسيعه)
   ======================================================= */
async function doAction(type){
  if (type === 'deposit' || type === 'withdraw'){
    const val = prompt(type === 'deposit' ? 'أدخل مبلغ الإيداع:' : 'أدخل مبلغ السحب:');
    if (!val) return;
    const amount = parseFloat(val);
    if (!amount || amount <= 0) return showToast('مبلغ غير صالح','error');
    try{
      const url = type === 'deposit' ? '/api/deposit' : '/api/withdraw';
      const { message } = await api(url, {
        method:'POST', body: JSON.stringify({ amount })
      });
      showToast(message || 'تم');
      await loadNotifications();
    } catch(e){ showToast(e.message, 'error'); }
    return;
  }
  if (type === 'fill' || type === 'take'){
    showToast('هذه الميزة قيد التطوير 🚧');
  }
}

/* =======================================================
   Auto-login
   ======================================================= */
(async () => {
  try{
    await enterDashboard();
  } catch(e){ /* غير مسجل دخول */ }
})();
</script>
