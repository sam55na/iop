<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICHANCY WEBSITE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ====================== الأساسيات ====================== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
body { background:#05060f; color:#e6ecff; min-height:100vh; overflow-x:hidden; position:relative; }

.bg-blobs { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.bg-blobs span { position:absolute; border-radius:50%; background: radial-gradient(circle, rgba(0,212,255,.18), transparent 70%); filter: blur(30px); animation: float 18s infinite ease-in-out; }
.bg-blobs span:nth-child(1){ width:300px;height:300px; top:-5%; left:-5%; animation-delay:0s;}
.bg-blobs span:nth-child(2){ width:400px;height:400px; top:40%; left:70%; animation-delay:3s; background: radial-gradient(circle, rgba(168,85,247,.18), transparent 70%);}
.bg-blobs span:nth-child(3){ width:250px;height:250px; top:70%; left:20%; animation-delay:6s;}
@keyframes float{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(80px,-100px) scale(1.3);} }

/* ====================== شاشة الدخول ====================== */
.auth-screen { position:relative; z-index:10; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.auth-card { width:100%; max-width:440px; padding:45px 40px; background: rgba(15,18,35,.7); backdrop-filter: blur(25px); border-radius:24px; border:1px solid rgba(0,212,255,.2); box-shadow: 0 25px 60px rgba(0,0,0,.6); animation: cardEntry .7s cubic-bezier(.2,.9,.3,1.2); }
@keyframes cardEntry{ from{opacity:0; transform:translateY(40px) scale(.95);} to{opacity:1; transform:none;} }

.logo { text-align:center; margin-bottom:28px; }
.logo h1 { font-size:26px; font-weight:900; letter-spacing:2px; background: linear-gradient(90deg,#00d4ff,#a855f7,#00d4ff); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation: shine 3s linear infinite; }
@keyframes shine{ to{ background-position:200% center; } }

.tabs { position:relative; display:flex; padding:5px; margin-bottom:28px; background: rgba(255,255,255,.04); border-radius:14px; }
.tab { flex:1; padding:12px; background:transparent; border:none; color:#8892b0; font-weight:700; font-size:14px; cursor:pointer; z-index:2; transition:color .3s; }
.tab.active{ color:#fff; }
.tab-slider { position:absolute; top:5px; bottom:5px; width:calc(50% - 5px); background: linear-gradient(135deg,#00d4ff,#a855f7); border-radius:10px; box-shadow:0 5px 20px rgba(0,212,255,.4); transition: transform .4s cubic-bezier(.68,-.55,.27,1.55); }
.tabs[data-active="register"] .tab-slider{ transform:translateX(-100%); }

.auth-form { display:none; flex-direction:column; gap:18px; }
.auth-form.active { display:flex; animation: fadeIn .4s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateX(15px);} to{opacity:1; transform:none;} }

.input-group { position:relative; }
.input-group input { width:100%; padding:18px 16px 8px; background: rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:12px; color:#fff; font-size:15px; outline:none; transition: all .3s; }
.input-group label { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:#6c7794; font-size:14px; pointer-events:none; transition: all .3s; }
.input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { top:10px; transform:none; font-size:11px; color:#00d4ff; }
.input-group input:focus { border-color: rgba(0,212,255,.5); background: rgba(0,212,255,.05); box-shadow: 0 0 0 4px rgba(0,212,255,.1); }

.btn-primary { padding:16px; border:none; border-radius:12px; background: linear-gradient(135deg,#00d4ff,#a855f7); color:#fff; font-weight:700; font-size:16px; cursor:pointer; transition: transform .3s, box-shadow .3s; box-shadow:0 10px 30px rgba(0,212,255,.3); }
.btn-primary:hover { transform:translateY(-3px); box-shadow:0 15px 40px rgba(168,85,247,.5); }
.switch-text { text-align:center; color:#6c7794; font-size:13px; }
.switch-text a { color:#00d4ff; text-decoration:none; font-weight:700; cursor:pointer; }

/* ====================== لوحة التحكم ====================== */
.dashboard { display:none; min-height:100vh; position:relative; z-index:10; flex-direction:column; }
.dashboard.active { display:flex; }

.topbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background: linear-gradient(90deg, rgba(15,18,35,.85), rgba(25,20,60,.85)); backdrop-filter: blur(20px); border-bottom:1px solid rgba(0,212,255,.15); position:sticky; top:0; z-index:100; }
.brand { display:flex; align-items:center; gap:8px; font-weight:900; font-size:18px; color: #fff; }
.user-chip { display:flex; align-items:center; gap:10px; padding:6px 14px 6px 6px; background: rgba(255,255,255,.05); border-radius:999px; }
.avatar { width:32px; height:32px; border-radius:50%; background: linear-gradient(135deg,#00d4ff,#a855f7); display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:14px; }
.logout-btn { background: transparent; border:1px solid rgba(255,80,80,.4); color:#ff6b6b; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px; }
.admin-btn { background: rgba(255, 215, 0, 0.1); border:1px solid rgba(255, 215, 0, 0.4); color:#ffd700; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px; display:none; }

.balance-bar { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background: rgba(10,14,30,.6); backdrop-filter: blur(15px); border-bottom:1px solid rgba(168,85,247,.15); }
.balance-value { font-size:26px; font-weight:900; background: linear-gradient(90deg,#00d4ff,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* الإشعارات */
.notif-wrap { position:relative; }
.notif-btn { width:44px; height:44px; border-radius:12px; background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:#e6ecff; cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center; }
.notif-badge { position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; background: #ff006e; border-radius:999px; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; color:#fff; }
.notif-badge.hidden { display:none; }

/* 🟢 إصلاح طبقة الإشعارات (z-index مرتفع) */
.notif-panel { position:absolute; top:56px; left:0; width:340px; max-height:420px; overflow-y:auto; background: rgba(15,18,35,.98); backdrop-filter: blur(25px); border:1px solid rgba(0,212,255,.3); border-radius:16px; box-shadow: 0 25px 60px rgba(0,0,0,.9); padding:12px; display:none; z-index:9999; }
.notif-panel.open { display:block; animation: fadeIn .3s ease; }
.notif-item { padding:10px; margin-bottom:6px; border-radius:10px; background: rgba(255,255,255,.05); border-right:3px solid transparent; }
.notif-item.unread { background: rgba(0,212,255,.1); border-right-color: #00d4ff; }

/* الأزرار (المربعات) */
.actions-zone { flex:1; padding:30px 24px; display:flex; flex-direction:column; }
.actions-rect { display:grid; grid-template-columns:1fr 1fr; gap:16px; } /* الحاويتان بجانب بعضهما */

.action-box { background: rgba(15,18,35,.7); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:12px; transition: all .4s; }
.action-box:hover { border-color: rgba(0,212,255,.4); transform:translateY(-2px); }
.action-box .btns { display:flex; flex-direction:column; gap:12px; } /* الأزرار فوق بعضها */

.action-btn { width: 100%; border:none; border-radius:12px; padding:16px; font-weight:700; font-size:15px; cursor:pointer; transition: all .3s; display:flex; align-items:center; justify-content:center; gap:8px; }
.action-btn img { width: 24px; height: 24px; object-fit: contain; } /* تنسيق الصور داخل الأزرار */

.action-btn.deposit { background: rgba(0,212,255,.1); border:1px solid rgba(0,212,255,.4); color:#00d4ff; }
.action-btn.deposit:hover { background: #00d4ff; color:#000; box-shadow:0 10px 30px rgba(0,212,255,.5); }

.action-btn.withdraw { background: rgba(255,80,80,.1); border:1px solid rgba(255,80,80,.4); color:#ff6b6b; }
.action-btn.withdraw:hover { background: #ff6b6b; color:#000; box-shadow:0 10px 30px rgba(255,80,80,.5); }

.action-btn.fill { background: rgba(168,85,247,.1); border:1px solid rgba(168,85,247,.4); color:#c084fc; }
.action-btn.fill:hover { background: #c084fc; color:#000; box-shadow:0 10px 30px rgba(168,85,247,.5); }

.action-btn.take { background: rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.4); color:#4ade80; }
.action-btn.take:hover { background: #4ade80; color:#000; box-shadow:0 10px 30px rgba(34,197,94,.5); }

.toast { position:fixed; bottom:24px; left:50%; transform:translate(-50%,120%); padding:14px 24px; border-radius:12px; background: rgba(15,18,35,.95); color:#fff; font-weight:700; transition: transform .4s; z-index:99999; }
.toast.show { transform:translate(-50%,0); }
.toast.error { border:1px solid #ff4d4d; }

@media (max-width:640px) {
  .actions-rect { grid-template-columns:1fr; } /* على الجوال تصبح فوق بعضها لتوفير المساحة */
  .notif-panel { width:300px; left:-100px; }
}
</style>
</head>
<body>

<div class="bg-blobs"><span></span><span></span><span></span></div>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="logo"><h1>ICHANCY WEBSITE</h1></div>
    <div class="tabs" data-active="login">
      <button class="tab active" data-tab="login">تسجيل الدخول</button>
      <button class="tab" data-tab="register">إنشاء حساب</button>
      <div class="tab-slider"></div>
    </div>

    <!-- تسجيل الدخول -->
    <form id="loginForm" class="auth-form active">
      <div class="input-group">
        <input type="text" id="loginName" placeholder=" " required>
        <label>الاسم الأول والثاني</label>
      </div>
      <div class="input-group">
        <input type="password" id="loginPassword" placeholder=" " required>
        <label>كلمة المرور</label>
      </div>
      <button type="submit" class="btn-primary">دخول</button>
      <p class="switch-text">ليس لديك حساب؟ <a data-tab="register">أنشئ حساباً</a></p>
    </form>

    <!-- إنشاء حساب -->
    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <input type="text" id="regName" placeholder=" " required>
        <label>الاسم الأول والثاني</label>
      </div>
      <div class="input-group">
        <input type="password" id="regPassword" placeholder=" " required minlength="6">
        <label>كلمة المرور</label>
      </div>
      <button type="submit" class="btn-primary">إنشاء الحساب</button>
      <p class="switch-text">لديك حساب؟ <a data-tab="login">سجل الدخول</a></p>
    </form>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="brand">
      <img src="" id="brandIcon" style="width:28px; height:28px; display:none;">
      <span id="brandText">⚡ ICHANCY WEBSITE</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="admin-btn" id="adminBtn" onclick="alert('لوحة الإدارة قريباً')">⚙️ إدارة</button>
      <div class="user-chip">
        <div class="avatar" id="avatar">U</div>
        <div class="name" id="userName">User</div>
      </div>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </div>

  <div class="balance-bar">
    <div>
      <div style="color:#8892b0; font-size:13px; font-weight:600;">رصيدك الحالي</div>
      <div class="balance-value">$<span id="balance">0.00</span></div>
    </div>
    <div class="notif-wrap">
      <button class="notif-btn" id="notifBtn">
        🔔 <span class="notif-badge hidden" id="notifBadge">0</span>
      </button>
      <!-- الإشعارات (z-index عالي جداً) -->
      <div class="notif-panel" id="notifPanel">
        <h4 style="margin-bottom:10px; color:#00d4ff;">📬 الإشعارات</h4>
        <div id="notifList"></div>
      </div>
    </div>
  </div>

  <div class="actions-zone">
    <div class="actions-rect">
      
      <!-- الحاوية الأولى -->
      <div class="action-box">
        <div style="color:#8892b0; font-weight:700;">💰 محفظتي</div>
        <div class="btns">
          <!-- الأزرار تحتوي على أماكن للصور من المصفوفة -->
          <button class="action-btn deposit" onclick="doAction('deposit')">
            <img id="iconDeposit" style="display:none"> <span>إيداع</span>
          </button>
          <button class="action-btn withdraw" onclick="doAction('withdraw')">
            <img id="iconWithdraw" style="display:none"> <span>سحب</span>
          </button>
        </div>
      </div>

      <!-- الحاوية الثانية -->
      <div class="action-box">
        <div style="color:#8892b0; font-weight:700;">🔄 التحويلات</div>
        <div class="btns">
          <button class="action-btn fill" onclick="doAction('fill')">
            <img id="iconFill" style="display:none"> <span>تعبئة حسابي</span>
          </button>
          <button class="action-btn take" onclick="doAction('take')">
            <img id="iconTake" style="display:none"> <span>سحب من حسابي</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =======================================================
   🖼️ مصفوفة الصور (قم بوضع روابط الصور المباشرة هنا)
   يمكنك تغيير هذه الروابط بصورك الخاصة وستظهر تلقائياً.
   إذا كان الرابط فارغاً "" سيتم استخدام الرمز التعبيري.
   ======================================================= */
const ASSETS = {
  logo: "",           // رابط صورة اللوجو (يظهر أعلى يسار الشريط)
  deposit: "",        // رابط صورة زر الإيداع
  withdraw: "",       // رابط صورة زر السحب
  fill: "",           // رابط صورة زر تعبئة حسابي
  take: ""            // رابط صورة زر سحب من حسابي
};

// دالة لتطبيق الصور من المصفوفة
function applyAssets() {
  if (ASSETS.logo) {
    document.getElementById('brandIcon').src = ASSETS.logo;
    document.getElementById('brandIcon').style.display = 'inline-block';
    document.getElementById('brandText').style.display = 'none';
  }
  if (ASSETS.deposit) { document.getElementById('iconDeposit').src = ASSETS.deposit; document.getElementById('iconDeposit').style.display = 'inline'; }
  if (ASSETS.withdraw) { document.getElementById('iconWithdraw').src = ASSETS.withdraw; document.getElementById('iconWithdraw').style.display = 'inline'; }
  if (ASSETS.fill) { document.getElementById('iconFill').src = ASSETS.fill; document.getElementById('iconFill').style.display = 'inline'; }
  if (ASSETS.take) { document.getElementById('iconTake').src = ASSETS.take; document.getElementById('iconTake').style.display = 'inline'; }
}
applyAssets(); // تشغيلها عند التحميل

/* =======================================================
   الأدوات المساعدة
   ======================================================= */
const $ = (s) => document.querySelector(s);
const toastEl = $('#toast');
function showToast(msg, type='success'){
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + type;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

async function api(url, options={}){
  const res = await fetch(url, { headers: {'Content-Type':'application/json'}, credentials:'include', ...options });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'حدث خطأ');
  return data;
}

/* =======================================================
   التبويبات
   ======================================================= */
document.querySelectorAll('.tab, [data-tab]').forEach(el => {
  if (el.classList.contains('tab') || el.tagName === 'A'){
    el.addEventListener('click', e => {
      const target = el.dataset.tab;
      if (!target) return;
      e.preventDefault();
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === target));
      $('#loginForm').classList.toggle('active', target === 'login');
      $('#registerForm').classList.toggle('active', target === 'register');
      $('.tabs').dataset.active = target;
    });
  }
});

/* =======================================================
   المصادقة (تسجيل الدخول والخروج)
   ======================================================= */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await api('/api/login', { method:'POST', body: JSON.stringify({ name: $('#loginName').value.trim(), password: $('#loginPassword').value }) });
    showToast('تم الدخول بنجاح ✓');
    await enterDashboard();
  } catch(err){ showToast(err.message, 'error'); }
});

$('#registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const name = $('#regName').value.trim();
    const password = $('#regPassword').value;
    await api('/api/register', { method:'POST', body: JSON.stringify({ name, password }) });
    await api('/api/login', { method:'POST', body: JSON.stringify({ name, password }) });
    showToast('تم إنشاء الحساب ✓');
    await enterDashboard();
  } catch(err){ showToast(err.message, 'error'); }
});

$('#logoutBtn').addEventListener('click', async () => {
  await api('/api/logout', {method:'POST'});
  location.reload();
});

/* =======================================================
   لوحة التحكم
   ======================================================= */
let currentUser = null;
let currentNotifs = [];

async function enterDashboard(){
  const { user } = await api('/api/me');
  currentUser = user;
  renderUser();
  $('#authScreen').style.display = 'none';
  $('#dashboard').classList.add('active');
  await loadNotifications();
}

function renderUser(){
  $('#userName').textContent = currentUser.name;
  $('#avatar').textContent = currentUser.name.charAt(0).toUpperCase();
  $('#balance').textContent = Number(currentUser.balance).toFixed(2);
  
  // إظهار زر الإدارة فقط إذا كان المستخدم أدمن
  if (currentUser.role === 'admin') {
    $('#adminBtn').style.display = 'block';
  } else {
    $('#adminBtn').style.display = 'none';
  }
}

/* =======================================================
   الإشعارات
   ======================================================= */
async function loadNotifications(){
  try {
    const data = await api('/api/notifications');
    currentNotifs = data.notifications;
    renderNotifs(data.unread);
  } catch(e) {}
}

function renderNotifs(unread){
  const badge = $('#notifBadge');
  if (unread > 0){ badge.textContent = unread; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');

  const list = $('#notifList');
  if (!currentNotifs.length){ list.innerHTML = '<div style="text-align:center; color:#6c7794; padding:20px;">لا توجد إشعارات</div>'; return; }
  
  list.innerHTML = currentNotifs.map(n => `
    <div class="notif-item ${n.is_read ? '' : 'unread'}">
      <div style="font-weight:700; font-size:13px; margin-bottom:4px;">${escapeHtml(n.title)}</div>
      <div style="font-size:12px; color:#8892b0;">${escapeHtml(n.body)}</div>
      <div style="font-size:10px; color:#5a6480; margin-top:6px;">${new Date(n.created_at).toLocaleString('ar')}</div>
    </div>
  `).join('');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('#notifBtn').addEventListener('click', async e => {
  e.stopPropagation();
  const p = $('#notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')){
    await api('/api/notifications/read', {method:'POST'}).catch(()=>{});
    currentNotifs.forEach(n => n.is_read = 1);
    renderNotifs(0);
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.notif-wrap')) $('#notifPanel').classList.remove('open');
});

/* =======================================================
   أزرار العمليات
   ======================================================= */
async function doAction(type){
  if (type === 'deposit' || type === 'withdraw'){
    const val = prompt(type === 'deposit' ? 'أدخل مبلغ الإيداع:' : 'أدخل مبلغ السحب:');
    if (!val) return;
    const amount = parseFloat(val);
    if (!amount || amount <= 0) return showToast('مبلغ غير صالح','error');
    try {
      const { message } = await api(type === 'deposit' ? '/api/deposit' : '/api/withdraw', { method:'POST', body: JSON.stringify({ amount }) });
      showToast(message || 'تم');
    } catch(e){ showToast(e.message, 'error'); }
    return;
  }
  if (type === 'fill' || type === 'take') showToast('هذه الميزة قيد التطوير 🚧');
}

/* تسجيل الدخول التلقائي */
(async () => { try { await enterDashboard(); } catch(e) {} })();
</script>
</body>
</html>
